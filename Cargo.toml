[package]
name = "orbit"
version = "0.2.0"
edition = "2021"
description = "A compact Linux system-monitoring TUI"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.33"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
